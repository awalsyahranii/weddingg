<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbe0f1"/>
      <stop offset="50%" stop-color="#e2eef8"/>
      <stop offset="100%" stop-color="#fdf7f2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fff9ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff9ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="500" height="650" fill="url(#heroSky)"/>
  <circle cx="250" cy="200" r="180" fill="url(#sunGlow)"/>

  <!-- Romantic floral background arches -->
  <path d="M50,650 C50,320 450,320 450,650" fill="none" stroke="#d4e4f0" stroke-width="60" opacity="0.4"/>
  <path d="M100,650 C100,380 400,380 400,650" fill="none" stroke="#ecd8c3" stroke-width="20" opacity="0.5"/>

  <!-- Groom & Bride Silhouette Standing Together Holding Hands -->
  <g transform="translate(45, 100)">
    <!-- Groom (Left) -->
    <path d="M140,550 C140,360 160,330 200,330 C220,330 235,360 235,550 Z" fill="#2b3a55"/>
    <ellipse cx="200" cy="280" rx="30" ry="36" fill="#2b3a55"/>

    <!-- Bride (Right) -->
    <path d="M220,550 C220,400 230,340 265,340 C290,340 330,420 345,550 Z" fill="#4c6a87" opacity="0.9"/>
    <!-- Flowing Bridal Dress -->
    <path d="M220,550 C240,430 270,410 300,550 Z" fill="#84a6c4" opacity="0.4"/>
    <ellipse cx="265" cy="290" rx="26" ry="32" fill="#384e73"/>
    
    <!-- Bridal Veil Glow -->
    <path d="M250,285 C230,360 220,480 205,550 L345,550 C320,480 300,360 280,285 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Holding hands center -->
    <circle cx="225" cy="400" r="12" fill="#d9b68a" opacity="0.8"/>
  </g>

  <!-- Foreground Floral Petals / Bouquet Accent -->
  <g transform="translate(250, 520)">
    <circle cx="-30" cy="0" r="22" fill="#dfc19c" opacity="0.9"/>
    <circle cx="0" cy="-15" r="28" fill="#f4e5d4" opacity="0.95"/>
    <circle cx="30" cy="0" r="24" fill="#84a6c4" opacity="0.85"/>
    <circle cx="-10" cy="15" r="20" fill="#9bb7ce" opacity="0.9"/>
    <circle cx="20" cy="18" r="18" fill="#ecd7be" opacity="0.9"/>
  </g>
</svg>
