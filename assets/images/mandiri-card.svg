<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 315" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838"/>
      <stop offset="35%" stop-color="#002b66"/>
      <stop offset="75%" stop-color="#001838"/>
      <stop offset="100%" stop-color="#050e1f"/>
    </linearGradient>

    <!-- Golden Wave Gradient -->
    <linearGradient id="goldWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5a93c" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#f3c358" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#e09e2d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd875" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Metallic Chip Gradient -->
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6bf70"/>
      <stop offset="30%" stop-color="#fcedb8"/>
      <stop offset="60%" stop-color="#c99a3e"/>
      <stop offset="100%" stop-color="#efd48e"/>
    </linearGradient>

    <!-- Mandiri Yellow Swoosh -->
    <linearGradient id="mandiriYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb700"/>
      <stop offset="100%" stop-color="#f39200"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="500" height="315" rx="16" fill="url(#cardBg)"/>

  <!-- Decorative Waves (Mandiri Style) -->
  <path d="M -20 180 C 120 110, 240 250, 520 120 L 520 315 L -20 315 Z" fill="url(#goldWave)" opacity="0.22"/>
  <path d="M -20 220 C 140 160, 280 290, 520 160 L 520 315 L -20 315 Z" fill="url(#goldWave)" opacity="0.38"/>
  <path d="M 180 315 C 320 240, 420 270, 520 210 L 520 315 Z" fill="#f5a81c" opacity="0.28"/>

  <!-- Subtle Texture Security Rings -->
  <circle cx="430" cy="55" r="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="36"/>
  <circle cx="430" cy="55" r="220" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="18"/>

  <!-- Mandiri Logo (Top Right) -->
  <g transform="translate(350, 22)">
    <!-- Mandiri Yellow Swoosh Ribbon -->
    <path d="M 22 2 C 45 -6, 92 -2, 114 14 C 98 8, 65 7, 42 11 C 26 13, 14 17, 4 23 C 10 13, 15 5, 22 2 Z" fill="url(#mandiriYellow)"/>
    <!-- Mandiri Text -->
    <text x="114" y="32" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="23" font-weight="900" fill="#ffffff" letter-spacing="-0.5" text-anchor="end">mandırı</text>
  </g>

  <!-- DEBIT Text (Top Left) -->
  <text x="34" y="42" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#cbd5e1" letter-spacing="2.5">DEBIT</text>

  <!-- EMV Gold Smart Chip (Left) -->
  <g transform="translate(34, 76)">
    <rect width="52" height="42" rx="7" fill="url(#chipGold)" stroke="#947127" stroke-width="1"/>
    <!-- Chip Microcircuit Lines -->
    <path d="M 0 21 L 52 21 M 17 0 L 17 42 M 35 0 L 35 42 M 17 13 L 0 13 M 17 29 L 0 29 M 35 13 L 52 13 M 35 29 L 52 29" fill="none" stroke="#805c1b" stroke-width="1.2"/>
    <rect x="17" y="13" width="18" height="16" rx="3" fill="none" stroke="#805c1b" stroke-width="1.2"/>
  </g>

  <!-- Contactless / NFC Wave -->
  <g transform="translate(100, 85)" stroke="rgba(255,255,255,0.7)" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 0 5 A 7 7 0 0 1 0 19"/>
    <path d="M 5 2 A 13 13 0 0 1 5 22"/>
    <path d="M 10 0 A 19 19 0 0 1 10 24"/>
  </g>

  <!-- Card Number (Embossed Silver Look) -->
  <g transform="translate(34, 180)">
    <text x="0" y="0" font-family="'Courier New', monospace, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="3.8" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">1740 0030 6649 5</text>
  </g>

  <!-- Valid Thru & Dates -->
  <g transform="translate(34, 222)">
    <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="1">VALID</text>
    <text x="0" y="9" font-family="'Montserrat', sans-serif" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="1">THRU</text>
    <text x="40" y="7" font-family="'Courier New', monospace, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1">11/29</text>
  </g>

  <!-- Cardholder Name (Embossed Look) -->
  <text x="34" y="270" font-family="'Courier New', monospace, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="2" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">HARI IRAWAL MUHAMMAD</text>

  <!-- GPN Logo (Bottom Right) -->
  <g transform="translate(408, 236)">
    <rect width="60" height="42" rx="7" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <!-- Red & White GPN Emblem -->
    <path d="M 9 10 L 22 10 L 22 32 L 9 32 Z" fill="#e11d48"/>
    <path d="M 13 14 L 18 14 L 18 28 L 13 28 Z" fill="#ffffff"/>
    <text x="27" y="26" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#1e293b" letter-spacing="0.5">GPN</text>
  </g>
</svg>
