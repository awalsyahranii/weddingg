<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <g opacity="0.85">
    <!-- Main stem -->
    <path d="M10,190 C40,120 70,70 190,10" stroke="#7a9ab5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10,190 C60,150 110,120 180,60" stroke="#9bb7ce" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M45,140 C35,115 55,100 70,115 C75,128 60,145 45,140 Z" fill="#94b2cd" fill-opacity="0.75"/>
    <path d="M85,100 C75,75 95,60 110,75 C115,88 100,105 85,100 Z" fill="#84a6c4" fill-opacity="0.7"/>
    <path d="M130,55 C120,30 140,15 155,30 C160,43 145,60 130,55 Z" fill="#759bbd" fill-opacity="0.65"/>
    <!-- Small side leaves -->
    <path d="M70,155 C90,145 105,160 95,175 C80,175 65,165 70,155 Z" fill="#a8c5dd" fill-opacity="0.6"/>
    <path d="M115,115 C135,105 150,120 140,135 C125,135 110,125 115,115 Z" fill="#9bb7ce" fill-opacity="0.65"/>
    <path d="M155,75 C175,65 190,80 180,95 C165,95 150,85 155,75 Z" fill="#8caec9" fill-opacity="0.7"/>
    <!-- Delicate buds & flowers -->
    <circle cx="190" cy="10" r="5" fill="#d9b68a"/>
    <circle cx="180" cy="60" r="4.5" fill="#e5c8a3"/>
    <circle cx="160" cy="20" r="3.5" fill="#d9b68a"/>
    <circle cx="120" cy="50" r="4" fill="#e8d5bc"/>
    <circle cx="65" cy="110" r="4" fill="#d9b68a"/>
    <circle cx="20" cy="175" r="5" fill="#e5c8a3"/>
    <!-- Golden Pistil Accents -->
    <path d="M185,15 Q195,5 200,10" stroke="#cfa470" stroke-width="1.2"/>
    <path d="M155,25 Q165,15 170,20" stroke="#cfa470" stroke-width="1.2"/>
  </g>
</svg>
